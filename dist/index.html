<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/stas-rg.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/stas-rg.png" />
  <title>STAS-RG Management System</title>

  <style>
  body, html {
    height: 100%;
    margin: 0;
    background-color: #f8fafc;
    overflow-x: hidden;
  }

  .loading-screen {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
    width: 100%;
    background: #ffffff;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    animation: fadeOutContainer 1s ease-in-out 4.5s forwards;
  }

  .loading-logo {
    display: flex;
    align-items: center;
    font-size: 5.5rem;
    font-weight: 900;
    margin: 0 0 30px 0;
    font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    animation: trackingIn 1.5s cubic-bezier(0.215, 0.610, 0.355, 1.000) forwards;
  }

  .loading-logo span {
    color: transparent;
    -webkit-text-stroke: 2px #cbd5e1;
    position: relative;
    display: inline-block;
    animation: fillAndGlow 1.2s ease-in-out forwards calc(1.5s + (var(--i) * 0.15s));
  }

  .loading-logo span.logo-g {
    -webkit-text-stroke: 0px transparent;
    color: transparent;
    display: inline-flex;
    align-items: center;
    margin-left: -4px; 
    opacity: 0; 
    animation: rollInAndStop 1.5s cubic-bezier(0.215, 0.610, 0.355, 1.000) forwards calc(1.5s + (var(--i) * 0.15s));
  }

  .loading-logo span.logo-g img {
    height: 85px; 
    width: auto;
    display: block; 
  }

  .loading-text {
    color: #22c55e;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 12px;
    font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    opacity: 0; 
    margin-right: -12px; 
    animation: fadeInText 1s ease forwards 1.5s, pulseSlow 2s ease-in-out infinite 2.5s;
  }

  @keyframes trackingIn {
    0% { letter-spacing: 0.7em; opacity: 0; filter: blur(15px); transform: scale(1.3); }
    100% { letter-spacing: 0.05em; opacity: 1; filter: blur(0); transform: scale(1); }
  }

  @keyframes fillAndGlow {
    0% { color: transparent; -webkit-text-stroke: 2px #cbd5e1; text-shadow: none; transform: translateY(0); }
    30% { transform: translateY(-15px); }
    50% { color: transparent; -webkit-text-stroke: 2px #22c55e; text-shadow: 0 0 15px rgba(34, 197, 94, 0.3); }
    100% { color: #22c55e; -webkit-text-stroke: 0px transparent; text-shadow: 0 0 10px rgba(34, 197, 94, 0.4), 0 0 25px rgba(34, 197, 94, 0.2); transform: translateY(0); }
  }

  @keyframes rollInAndStop {
    0% { opacity: 0; transform: translateX(150px) rotate(720deg); }
    50% { opacity: 1; }
    100% { opacity: 1; transform: translateX(0) rotate(0deg); }
  }

  @keyframes fadeInText { to { opacity: 1; } }

  @keyframes pulseSlow {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  
  @keyframes fadeOutContainer {
    to { opacity: 0; visibility: hidden; }
  }

  @media (max-width: 768px) {
    .loading-logo { font-size: 3.5rem; }
    .loading-logo span.logo-g img { height: 55px; }
    @keyframes trackingIn {
      0% { letter-spacing: 0.3em; opacity: 0; filter: blur(10px); transform: scale(1.1); }
      100% { letter-spacing: 0.05em; opacity: 1; filter: blur(0); transform: scale(1); }
    }
    .loading-text { font-size: 0.9rem; letter-spacing: 8px; }
  }
  
  @media (max-width: 480px) {
      .loading-logo { font-size: 2.5rem; }
      .loading-logo span.logo-g img { height: 40px; }
  }
  </style>
  <script type="module" crossorigin src="/assets/index-FMb9AsCO.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-D3O5UP1N.css">
</head>

<body>
  <div class="loading-screen">
    <div class="loading-logo">
      <span style="--i:1">S</span>
      <span style="--i:2">T</span>
      <span style="--i:3">A</span>
      <span style="--i:4">S</span>
      <span style="--i:5">-</span>
      <span style="--i:8">R</span><span style="--i:8" class="logo-g">
        <img src="/stas-rg.png" alt="Logo G Labirin" onerror="this.src='/Logo G - STAS RG.png'">
      </span>
    </div>
    <div class="loading-text">MEMUAT...</div>
  </div>

  <script>
    const loadingScreen = document.querySelector(".loading-screen");
    if (loadingScreen) {
      loadingScreen.addEventListener("animationend", (event) => {
        if(event.animationName === "fadeOutContainer") {
          document.body.classList.add("loaded");
          setTimeout(() => { loadingScreen.remove(); }, 100);
        }
      });
    }
  </script>
  <div id="root"></div>
</body>

</html>
